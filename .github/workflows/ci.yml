name: Plugin CI

on:
  push:
    branches: [main, feat/rework]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed to compare lint diagnostics against the previous push/PR base.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm build

      - name: Verify feature directory layout
        run: pnpm verify:feature-layout

      - name: Run Cucumber tests
        run: pnpm test

      - name: TypeScript compilation
        run: pnpm run typecheck

      - name: CSS regression check
        run: node scripts/css-regression-check.mjs

      - name: Validate changelog script
        run: node --check scripts/changelog.cjs

      - name: Changelog preview (dry-run)
        run: node scripts/changelog.cjs preview

      - name: Reject newly introduced ESLint errors
        env:
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm lint:changed

      - name: Architecture regression gate
        run: pnpm lint:architecture

      - name: Validate vault sync script
        run: node --check scripts/sync-vault.mjs

      - name: Verify release metadata and assets
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = path => JSON.parse(fs.readFileSync(path, 'utf8'));
          const manifest = read('assets/manifest.json');
          const distManifest = read('dist/manifest.json');
          const pkg = read('package.json');
          const versions = read('versions.json');
          if (manifest.id !== 'storyline') throw new Error('Unexpected plugin ID');
          if (manifest.version !== pkg.version) {
            throw new Error('Version mismatch: manifest vs package');
          }
          if (manifest.version !== distManifest.version) {
            throw new Error('Version mismatch: assets manifest vs dist manifest');
          }
          if (versions[manifest.version] !== manifest.minAppVersion) {
            throw new Error('versions.json lacks the current compatibility entry');
          }
          for (const file of ['dist/main.js', 'dist/manifest.json', 'dist/styles.css']) {
            if (!fs.existsSync(file) || !fs.statSync(file).size) {
              throw new Error('Missing build artifact: ' + file);
            }
          }
          NODE

      - name: Upload testable build
        uses: actions/upload-artifact@v4
        with:
          name: storyline-plugin
          path: dist/
          if-no-files-found: error
